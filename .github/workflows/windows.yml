name: Windows build + release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the ORIGINAL frontend from pinned upstream (upstream untouched)
        shell: bash
        run: bash scripts/build-frontend.sh

      - name: Headless brain tests
        run: cargo test -p fresscore

      - name: Build host (release)
        run: cargo build --release -p fress-operon

      - name: Smoke the shipped exe (GUI boot path, brain, page really loads)
        run: |
          $exe = "target\release\fress-operon.exe"
          if (-not (Test-Path $exe)) { throw "exe missing" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru -Wait
          $code = $p.ExitCode
          $result = if (Test-Path "target\release\smoke-result.txt") { Get-Content "target\release\smoke-result.txt" -Raw } else { "" }
          Write-Host "exit code: $code"
          Write-Host $result
          if ($code -ne 0) { throw "smoke exited with $code" }
          if ($result -notmatch "SMOKE OK") { throw "smoke verdict missing/failed" }
          if ($result -notmatch "brain=ok") { throw "brain boot payload wrong" }
          if ($result -notmatch "page=PAGE OK") { throw "PAGE FAILED TO LOAD — the v1.0.2-beta regression guard fired" }

      - name: "Size gate (the lite deal: max 30 MB)"
        shell: bash
        run: |
          SIZE=$(stat -c%s target/release/fress-operon.exe)
          echo "exe bytes: $SIZE"
          if [ "$SIZE" -gt 31457280 ]; then echo "OVER 30 MB"; exit 1; fi

      - name: Package (zip + SHA256SUMS)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item target\release\fress-operon.exe stage\Fress-Operon.exe
          Copy-Item README.md stage\README.md
          Copy-Item LICENSE stage\LICENSE
          Copy-Item NOTICE stage\NOTICE
          Compress-Archive -Path stage\* -DestinationPath Fress-Operon-win-x64.zip -Force
          $zipHash = (Get-FileHash Fress-Operon-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash stage\Fress-Operon.exe -Algorithm SHA256).Hash.ToLower()
          "zip sha256: $zipHash" | Out-File -Encoding ascii SHA256SUMS.txt
          "exe sha256: $exeHash" | Out-File -Encoding ascii -Append SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: "Verify zip size again (with docs)"
        shell: pwsh
        run: |
          $size = (Get-Item Fress-Operon-win-x64.zip).Length
          Write-Host "zip bytes: $size"
          if ($size -gt 31457280) { throw "ZIP OVER 30 MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: Fress-Operon-win-x64
          path: |
            Fress-Operon-win-x64.zip
            SHA256SUMS.txt

      - name: Release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Fress-Operon-win-x64.zip
            SHA256SUMS.txt
